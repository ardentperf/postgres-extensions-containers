name: Build, test and publish a target extension

on:
  workflow_call:
    inputs:
      extension_name:
        description: "The PostgreSQL extension to build (directory name)"
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions: {}

jobs:
  testbuild:
    name: Build ${{ inputs.extension_name }}
    runs-on: ${{ github.repository_owner == 'cloudnative-pg' && 'ubuntu-latest-16-cores' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
      # Required by the cosign step
      id-token: write
    outputs:
      metadata: ${{ steps.build.outputs.metadata }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: 'linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        id: build
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          environment: testing
          registry: ghcr.io/${{ github.repository_owner }}
          revision: ${{ github.sha }}
        with:
          files: ./docker-bake.hcl,./${{ inputs.extension_name }}/metadata.hcl
          push: true

      # From bake's metadata, extract each unique tag (e.g. the ones with the timestamp)
      - name: Generated images
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        id: images
        run: |
          echo "images=$(jq -c '[ .[]."image.name" | split(",")[] | select(test("[0-9]{12}")) ]' <<< "$BUILD_METADATA")" >>  "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # See https://github.blog/security/supply-chain-security/safeguard-container-signing-capability-actions/
        # and https://github.com/actions/starter-workflows/blob/main/ci/docker-publish.yml for more details on
        # how to use cosign.

      - name: Compose and attach SBOMs
        env:
          EXTENSION_NAME: ${{ inputs.extension_name }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          # Export builder-stage SBOMs per target and platform; the pushed image
          # supplies cached layers, and the final scratch stage is not scanned.
          export environment=testing
          export registry="${IMAGE_REGISTRY}"
          export revision="${GITHUB_SHA}"
          working_directory="${RUNNER_TEMP}/extension-sbom"
          mkdir -p "${working_directory}/manifests" "${working_directory}/predicates"
          : > "${working_directory}/manifest.tsv"
          bake_files=(-f docker-bake.hcl -f "${EXTENSION_NAME}/metadata.hcl")
          bake_definition="${working_directory}/bake.json"
          docker buildx bake "${bake_files[@]}" --print > "${bake_definition}"
          build_definition_sha256=$(sha256sum "${bake_definition}" | awk '{print $1}')
          annotation_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          composer_revision=$(git rev-parse HEAD)
          python_version=$(python3 --version 2>&1)
          docker_version=$(docker --version)
          buildx_version=$(docker buildx version)
          jq_version=$(jq --version)
          cosign_version=$(cosign version 2>&1 | sed -n '1p')

          # Inject the SBOM stage selector into a temporary Dockerfile.
          sed '1iARG BUILDKIT_SBOM_SCAN_STAGE=builder' "${EXTENSION_NAME}/Dockerfile" > "${EXTENSION_NAME}/.sbom.Dockerfile"

          mapfile -t bake_targets < <(jq -r '.target | keys[]' "${bake_definition}")
          test "${#bake_targets[@]}" -gt 0

          for bake_target in "${bake_targets[@]}"; do
            image=$(jq -r --arg target "${bake_target}" '.target[$target].tags[0]' "${bake_definition}")
            test -n "${image}" && test "${image}" != "null"

            for platform in linux/amd64 linux/arm64; do
              platform_name=${platform//\//-}
              output_directory="${working_directory}/${bake_target}-${platform_name}"
              mkdir -p "${output_directory}"

              # BuildKit reuses the pushed build's cached layers; this adds only
              # the local SBOM generation and export work.
              docker buildx bake "${bake_files[@]}" "${bake_target}" \
                --set "*.platform=${platform}" \
                --set "*.dockerfile=.sbom.Dockerfile" \
                --set "*.output=type=local,dest=${output_directory}" \
                --set "*.attest=type=sbom" \
                --progress plain

              builder_sbom="${output_directory}/sbom-builder.spdx.json"
              test -s "${builder_sbom}"
              jq -e '.predicateType == "https://spdx.dev/Document" and .predicate.name == "sbom-builder" and (.subject | length > 0)' "${builder_sbom}"

              architecture=${platform#*/}
              image_manifest_digest=$(docker buildx imagetools inspect "${image}" --raw | \
                jq -r --arg architecture "${architecture}" '
                  [.manifests[] |
                   select(.platform.os == "linux" and .platform.architecture == $architecture) |
                   .digest] | first // empty')
              test -n "${image_manifest_digest}" && test "${image_manifest_digest}" != "null"

              builder_sbom_sha256=$(sha256sum "${builder_sbom}" | awk '{print $1}')
              predicate_directory="${working_directory}/predicates/${bake_target}-${platform_name}"
              predicate="${predicate_directory}/extension-sbom.spdx.json"
              provenance_manifest="${working_directory}/manifests/${bake_target}-${platform_name}.json"
              mkdir -p "${predicate_directory}"
              composer_command="./scripts/compose_sbom.py --builder-sbom ${builder_sbom} --extension-name ${EXTENSION_NAME} --provenance-manifest ${provenance_manifest} --output ${predicate}"
              jq -n \
                --arg annotation_date "${annotation_date}" \
                --arg builder_sbom_sha256 "${builder_sbom_sha256}" \
                --arg build_definition_sha256 "${build_definition_sha256}" \
                --arg source_commit "${GITHUB_SHA}" \
                --arg target "${bake_target}" \
                --arg platform "${platform}" \
                --arg image_manifest_digest "${image_manifest_digest}" \
                --arg composer_revision "${composer_revision}" \
                --arg composer_command "${composer_command}" \
                --arg python_version "${python_version}" \
                --arg docker_version "${docker_version}" \
                --arg buildx_version "${buildx_version}" \
                --arg jq_version "${jq_version}" \
                --arg cosign_version "${cosign_version}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg workflow "${GITHUB_WORKFLOW}" \
                --arg ref "${GITHUB_REF}" \
                --arg run_id "${GITHUB_RUN_ID}" \
                --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
                --arg actor "${GITHUB_ACTOR}" \
                '{
                  schemaVersion: "cnpg.sbom-composition/v1",
                  annotationDate: $annotation_date,
                  inputs: {
                    builderSbom: {sha256: $builder_sbom_sha256},
                    buildDefinition: {sha256: $build_definition_sha256}
                  },
                  image: {
                    sourceCommit: $source_commit,
                    target: $target,
                    platform: $platform,
                    manifestDigest: $image_manifest_digest
                  },
                  composer: {
                    revision: $composer_revision,
                    command: $composer_command,
                    interpreter: $python_version,
                    toolVersions: {
                      python: $python_version,
                      docker: $docker_version,
                      buildx: $buildx_version,
                      jq: $jq_version,
                      cosign: $cosign_version
                    }
                  },
                  workflow: {
                    repository: $repository,
                    name: $workflow,
                    ref: $ref,
                    runId: $run_id,
                    runAttempt: $run_attempt,
                    actor: $actor
                  }
                }' > "${provenance_manifest}"
              test -s "${provenance_manifest}"
              jq -e --arg namespace "cnpg.sbom-composition/v1" \
                --arg builder_sbom_sha256 "${builder_sbom_sha256}" \
                --arg build_definition_sha256 "${build_definition_sha256}" \
                '.schemaVersion == $namespace and
                 .inputs.builderSbom.sha256 == $builder_sbom_sha256 and
                 .inputs.buildDefinition.sha256 == $build_definition_sha256' \
                "${provenance_manifest}"

              ./scripts/compose_sbom.py \
                --builder-sbom "${builder_sbom}" \
                --extension-name "${EXTENSION_NAME}" \
                --provenance-manifest "${provenance_manifest}" \
                --output "${predicate}"

              test -s "${predicate}"
              jq -e --arg namespace "cnpg.sbom-composition/v1" '
                .spdxVersion == "SPDX-2.3" and
                .SPDXID == "SPDXRef-DOCUMENT" and
                any((.annotations // [])[];
                  .spdxElementId == "SPDXRef-DOCUMENT" and
                  .annotationType == "OTHER" and
                  (.comment | startswith($namespace + " ")))' \
                "${predicate}"

              cosign attest --yes \
                --type https://spdx.dev/Document \
                --predicate "${predicate}" \
                "${image}@${image_manifest_digest}"

              printf '%s\t%s\tpredicates/%s-%s/extension-sbom.spdx.json\n' \
                "${image}" "${architecture}" "${bake_target}" "${platform_name}" \
                >> "${working_directory}/manifest.tsv"
            done
          done

      - name: Upload composed SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/extension-sbom/manifest.tsv
            ${{ runner.temp }}/extension-sbom/manifests
            ${{ runner.temp }}/extension-sbom/predicates

      # Even if we're testing we sign the images, so we can push them to production later if that's required
      - name: Sign images
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          jq -r '.[] | (."image.name" | sub(",.*";"")) + "@" + ."containerimage.digest"' <<< "$BUILD_METADATA" | \
            xargs cosign sign --yes

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    needs:
      - testbuild
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJson(needs.testbuild.outputs.images)}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Security checks
        uses: cloudnative-pg/postgres-containers/.github/actions/security-scans@main
        with:
          image: "${{ matrix.image }}"
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          snyk_token: ${{ secrets.SNYK_TOKEN }}
          dockerfile: "${{ inputs.extension_name }}/Dockerfile"

  generate-smoke-test-matrix:
    name: Generate matrix for smoke tests
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      # main plus the latest and previous supported minor release branches.
      - name: Compute CNPG release matrix
        id: versions
        env:
          # renovate: datasource=github-tags depName=cloudnative-pg/cloudnative-pg versioning=semver-coerced extractVersion=^v(?<version>\d+\.\d+)\.\d+$
          LATEST_RELEASE: "1.30"
        run: |
          PREVIOUS_RELEASE=$(awk -F. '{print $1"."$2-1}' <<< "$LATEST_RELEASE")
          versions=$(jq -cn --arg latest "$LATEST_RELEASE" --arg previous "$PREVIOUS_RELEASE" \
            '["main", $previous, $latest]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    needs:
      - testbuild
      - generate-smoke-test-matrix
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJson(needs.testbuild.outputs.images)}}
        cnpg: ${{fromJson(needs.generate-smoke-test-matrix.outputs.versions)}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install Kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          # renovate: datasource=github-tags depName=kubernetes-sigs/kind versioning=semver
          version: v0.33.0
          install_only: true

      - name: Install Dagger
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.9
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh

      - name: Set up environment
        env:
          CNPG_RELEASE: ${{ matrix.cnpg }}
        run: |
          task e2e:setup-env CNPG_RELEASE=$CNPG_RELEASE

      - name: Generate Chainsaw testing values
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          EXTENSION_NAME: ${{ inputs.extension_name }}
        run: |
          task e2e:generate-values EXTENSION_IMAGE="${MATRIX_IMAGE}" TARGET="${EXTENSION_NAME}"

      - name: Run e2e tests
        env:
          EXTENSION_NAME: ${{ inputs.extension_name }}
        run: |
          # Get Kind cluster internal kubeconfig
          task e2e:export-kubeconfig KUBECONFIG_PATH=./kubeconfig INTERNAL=true

          task e2e:test TARGET="${EXTENSION_NAME}" KUBECONFIG_PATH="./kubeconfig"

  copytoproduction:
    name: Copy images to production
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    needs:
      - testbuild
      - security
      - smoke-test
    permissions:
      contents: read
      packages: write
      # Required by the cosign step
      id-token: write
    steps:
      - name: Copy to production
        uses: cloudnative-pg/postgres-containers/.github/actions/copy-images@main
        with:
          bake_build_metadata: "${{ needs.testbuild.outputs.metadata }}"
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download composed SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          path: extension-sboms

      - name: Install cosign for promoted SBOMs
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attach SBOMs to production images
        run: |
          set -Eeuo pipefail

          while IFS=$'\t' read -r testing_image architecture predicate_path; do
            test -n "${testing_image}"
            production_image="${testing_image/-testing:/:}"
            predicate="extension-sboms/${predicate_path}"
            test -s "${predicate}"
            jq -e --arg namespace "cnpg.sbom-composition/v1" '
              .spdxVersion == "SPDX-2.3" and
              .SPDXID == "SPDXRef-DOCUMENT" and
              any((.annotations // [])[];
                .spdxElementId == "SPDXRef-DOCUMENT" and
                .annotationType == "OTHER" and
                (.comment | startswith($namespace + " ")))' \
              "${predicate}"

            digest=$(docker buildx imagetools inspect "${production_image}" --raw | \
              jq -r --arg architecture "${architecture}" '
                [.manifests[] |
                 select(.platform.os == "linux" and .platform.architecture == $architecture) |
                 .digest] | first // empty')
            test -n "${digest}" && test "${digest}" != "null"

            cosign attest --yes \
              --type https://spdx.dev/Document \
              --predicate "${predicate}" \
              "${production_image}@${digest}"
          done < extension-sboms/manifest.tsv
