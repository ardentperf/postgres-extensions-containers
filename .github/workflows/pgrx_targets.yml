name: Build, test and publish a pgrx target

on:
  workflow_call:
    inputs:
      extension_name:
        description: "The pgrx extension to build"
        required: true
        type: string
      local:
        description: "Use a local registry and skip GitHub-only side effects"
        required: false
        default: false
        type: boolean
      platform:
        description: "Single platform for local validation; empty selects the production multi-arch matrix"
        required: false
        default: ""
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions: {}

jobs:
  testbuild:
    name: Build ${{ inputs.extension_name }}
    runs-on: ${{ github.repository_owner == 'cloudnative-pg' && 'ubuntu-latest-16-cores' || 'ubuntu-24.04' }}
    outputs:
      metadata: ${{ steps.build.outputs.metadata }}
      images: ${{ steps.images.outputs.images }}
      sbom_manifest: ${{ steps.sbom.outputs.manifest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install ScanCode
        env:
          # renovate: datasource=github-releases depName=aboutcode-org/scancode-toolkit versioning=semver
          SCANCODE_VERSION: 32.5.0
          SCANCODE_SHA256: 638adcd0af576d1f4d5b64dde228724b3ca4fdee2c4de20d88e4356be353f027
        run: |
          archive="${RUNNER_TEMP}/scancode-toolkit.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/aboutcode-org/scancode-toolkit/releases/download/v${SCANCODE_VERSION}/scancode-toolkit-v${SCANCODE_VERSION}_py3.12-linux.tar.gz" \
            --output "${archive}"
          echo "${SCANCODE_SHA256}  ${archive}" | sha256sum --check
          scancode_root="${RUNNER_TEMP}/scancode-toolkit"
          mkdir -p "${scancode_root}"
          tar -xzf "${archive}" --strip-components=1 -C "${scancode_root}"
          (cd "${scancode_root}" && ./configure)
          echo "${scancode_root}/venv/bin" >> "${GITHUB_PATH}"

      - name: Log in to the GitHub Container registry
        if: ${{ !inputs.local }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: ${{ inputs.local && 'network=host' || '' }}

      - name: Build and push pgrx image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        id: build
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          environment: testing
          registry: ${{ inputs.local && '127.0.0.1:5000' || format('ghcr.io/{0}', github.repository_owner) }}
          revision: ${{ github.sha }}
        with:
          files: ./docker-bake-pgrx.hcl,./${{ inputs.extension_name }}/metadata.hcl
          source: .
          set: |
            ${{ inputs.platform != '' && format('*.platform={0}', inputs.platform) || '' }}
          push: true

      - name: Generated images
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        id: images
        run: echo "images=$(jq -c '[ .[]."image.name" | split(",")[] | select(test("[0-9]{12}")) ]' <<< "$BUILD_METADATA")" >> "$GITHUB_OUTPUT"

      - name: Compose filesystem and Cargo SPDX
        id: sbom
        env:
          EXTENSION_NAME: ${{ inputs.extension_name }}
          IMAGE_REGISTRY: ${{ inputs.local && '127.0.0.1:5000' || format('ghcr.io/{0}', github.repository_owner) }}
          BUILD_PLATFORMS: ${{ inputs.platform != '' && inputs.platform || 'linux/amd64 linux/arm64' }}
        run: ./pgrx/compose_sboms.sh

      - name: Run local Trivy against every aggregate predicate
        if: ${{ inputs.local }}
        run: |
          shopt -s nullglob
          predicates=("${RUNNER_TEMP}"/extension-sbom/predicates/*/extension-sbom.spdx.json)
          test "${#predicates[@]}" -gt 0
          for predicate in "${predicates[@]}"; do
            # The job container's filesystem is not visible to the host Docker
            # daemon used by act. Stream each predicate into the scanner
            # container so local and hosted runners exercise the same report.
            cat "${predicate}" | docker run --rm -i --entrypoint /bin/sh aquasec/trivy:0.66.0 \
              -c 'cat > /tmp/sbom.spdx.json && trivy sbom --scanners vuln,license --no-progress --skip-version-check /tmp/sbom.spdx.json'
          done

      - name: Upload composed SPDX artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/extension-sbom/attestation-manifest.json
            ${{ runner.temp }}/extension-sbom/manifests
            ${{ runner.temp }}/extension-sbom/predicates

      - name: Install cosign
        if: ${{ !inputs.local }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign testing images
        if: ${{ !inputs.local }}
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: jq -r '.[] | (."image.name" | sub(",.*";"")) + "@" + ."containerimage.digest"' <<< "$BUILD_METADATA" | xargs cosign sign --yes

  attest-sboms:
    name: Attest aggregate SBOM (${{ matrix.sbom.target }})
    if: ${{ !inputs.local }}
    runs-on: ubuntu-24.04
    needs: [testbuild]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        sbom: ${{ fromJson(needs.testbuild.outputs.sbom_manifest || '[]') }}
    steps:
      - name: Download composed SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          path: extension-sboms
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest aggregate SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.sbom.testingSubject }}
          subject-digest: ${{ matrix.sbom.indexDigest }}
          sbom-path: extension-sboms/${{ matrix.sbom.predicatePath }}
          push-to-registry: true
          create-storage-record: false

  security:
    name: Security checks
    if: ${{ !inputs.local }}
    runs-on: ubuntu-24.04
    needs: [testbuild]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.testbuild.outputs.images) }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Security checks
        uses: cloudnative-pg/postgres-containers/.github/actions/security-scans@main
        with:
          image: ${{ matrix.image }}
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          snyk_token: ${{ secrets.SNYK_TOKEN }}
          dockerfile: ${{ inputs.extension_name }}/Dockerfile

  generate-smoke-test-matrix:
    name: Generate CNPG matrix
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Compute CNPG release matrix
        id: versions
        env:
          # renovate: datasource=github-tags depName=cloudnative-pg/cloudnative-pg versioning=semver-coerced extractVersion=^v(?<version>\d+\.\d+)\.\d+$
          LATEST_RELEASE: "1.30"
        run: |
          previous=$(awk -F. '{print $1"."$2-1}' <<< "$LATEST_RELEASE")
          echo "versions=$(jq -cn --arg latest "$LATEST_RELEASE" --arg previous "$previous" '["main", $previous, $latest]')" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: CNPG smoke/E2E
    runs-on: ubuntu-24.04
    needs: [testbuild, generate-smoke-test-matrix]
    strategy:
      fail-fast: false
      # Keep the shared local Kind control plane responsive for the
      # compute-heavy pg-search image when acceptance is run with act.
      max-parallel: 1
      matrix:
        image: ${{ fromJson(needs.testbuild.outputs.images) }}
        cnpg: ${{ fromJson(needs.generate-smoke-test-matrix.outputs.versions) }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.44.0
      - name: Install Kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.33.0
          install_only: true
      - name: Install Dagger
        env:
          # renovate: datasource=github-tags depName=dagger/dagger versioning=semver
          DAGGER_VERSION: 0.21.9
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          dagger version
      - name: Set up environment
        env:
          CNPG_RELEASE: ${{ matrix.cnpg }}
          MATRIX_IMAGE: ${{ matrix.image }}
        run: |
          # The image digest is unique per distro variant. Include it in the
          # engine name so concurrent matrix jobs do not race on one Docker
          # container name when the workflow is run locally with act.
          image_suffix=$(printf '%s' "$MATRIX_IMAGE" | sha256sum | cut -c1-12)
          export DAGGER_ENGINE_NAME="dagger-engine-pg-extensions-${CNPG_RELEASE}-${image_suffix}"
          echo "DAGGER_ENGINE_NAME=$DAGGER_ENGINE_NAME" >> "$GITHUB_ENV"
          task e2e:setup-env CNPG_RELEASE="$CNPG_RELEASE" DAGGER_ENGINE_NAME="$DAGGER_ENGINE_NAME"
      - name: Generate Chainsaw values
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          EXTENSION_NAME: ${{ inputs.extension_name }}
        run: task e2e:generate-values EXTENSION_IMAGE="$MATRIX_IMAGE" TARGET="$EXTENSION_NAME" DAGGER_ENGINE_NAME="$DAGGER_ENGINE_NAME"
      - name: Run Chainsaw E2E
        env:
          EXTENSION_NAME: ${{ inputs.extension_name }}
        run: |
          task e2e:export-kubeconfig KUBECONFIG_PATH=./kubeconfig INTERNAL=true DAGGER_ENGINE_NAME="$DAGGER_ENGINE_NAME"
          task e2e:test TARGET="$EXTENSION_NAME" KUBECONFIG_PATH=./kubeconfig DAGGER_ENGINE_NAME="$DAGGER_ENGINE_NAME"

  copytoproduction:
    name: Copy and verify image indexes
    if: ${{ always() && needs.testbuild.result == 'success' && (needs.security.result == 'success' || needs.security.result == 'skipped') && needs.smoke-test.result == 'success' && (needs.attest-sboms.result == 'success' || needs.attest-sboms.result == 'skipped') }}
    runs-on: ubuntu-24.04
    needs: [testbuild, attest-sboms, security, smoke-test]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        if: ${{ inputs.local }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download local SPDX artifacts
        if: ${{ inputs.local }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          path: extension-sboms
      - name: Copy testing indexes in the local registry
        if: ${{ inputs.local }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=host
      - name: Verify local copy preserves index and platform digests
        if: ${{ inputs.local }}
        run: |
          artifact="extension-sboms"
          jq -c '.[]' "$artifact/attestation-manifest.json" | while read -r record; do
            testing=$(jq -r '.testingImage' <<< "$record")
            production=$(jq -r '.productionImage' <<< "$record")
            docker buildx imagetools create --tag "$production" "$testing"
            source_digest=$(docker buildx imagetools inspect "$testing" --raw | sha256sum | awk '{print "sha256:"$1}')
            destination_digest=$(docker buildx imagetools inspect "$production" --raw | sha256sum | awk '{print "sha256:"$1}')
            test "$source_digest" = "$destination_digest"
          done
      - name: Copy images to production registry
        if: ${{ !inputs.local && github.ref == 'refs/heads/main' }}
        uses: cloudnative-pg/postgres-containers/.github/actions/copy-images@main
        with:
          bake_build_metadata: ${{ needs.testbuild.outputs.metadata }}
          registry_user: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

  attest-production-sboms:
    name: Attest production aggregate SBOM
    if: ${{ !inputs.local && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    needs: [copytoproduction, testbuild]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        sbom: ${{ fromJson(needs.testbuild.outputs.sbom_manifest) }}
    steps:
      - name: Download composed SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sboms-${{ inputs.extension_name }}-${{ github.run_id }}
          path: extension-sboms
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest production aggregate SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.sbom.productionSubject }}
          subject-digest: ${{ matrix.sbom.indexDigest }}
          sbom-path: extension-sboms/${{ matrix.sbom.predicatePath }}
          push-to-registry: true
          create-storage-record: false
